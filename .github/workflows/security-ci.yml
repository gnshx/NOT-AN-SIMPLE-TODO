name: Security Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-audit:
    name: Run Security Test Harness & Audit Controls
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: |
          cd web
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Next.js Type Check & Compilation
        run: |
          cd web
          npm run build

      - name: Execute Automated Security Verification Suite
        run: |
          npx ts-node --compiler-options '{"module":"CommonJS"}' tests/security/runAllSecurityTests.ts

      - name: Upload Security Scorecard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-scorecard
          path: security/scorecard.json
