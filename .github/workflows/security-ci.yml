name: Security Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-audit:
    name: Run Security Test Harness & Audit Controls
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      ENCRYPTION_MASTER_KEY: "dummy_ephemeral_test_secret_purged"
      AUTH_SECRET: "dummy_ephemeral_test_secret_purged"
      NEXTAUTH_SECRET: "dummy_ephemeral_test_secret_purged"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: |
          cd web
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Dependency Vulnerability Audit
        run: |
          cd web
          npm audit --audit-level=critical || echo "Security audit review finished"

      - name: Next.js Type Check & Compilation
        run: |
          cd web
          npm run build

      - name: Execute Automated Security Verification Suite
        run: |
          cd web
          npm run test:security

      - name: Upload Security Scorecard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-scorecard
          path: security/scorecard.json
